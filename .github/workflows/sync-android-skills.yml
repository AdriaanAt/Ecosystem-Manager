name: Sync android/skills (vendoring)

on:
  schedule:
    - cron: '0 6 * * 1'  # cada lunes a las 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-android-skills
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MobiAI-Core
        uses: actions/checkout@v4

      - name: Checkout android/skills (shallow)
        uses: actions/checkout@v4
        with:
          repository: android/skills
          path: _upstream

      - name: Verify upstream LICENSE is unchanged Apache 2.0
        run: |
          set -euo pipefail
          if ! grep -q "Apache License" _upstream/LICENSE.txt; then
            echo "::error::Upstream LICENSE.txt no longer contains 'Apache License'. Manual review required."
            exit 1
          fi
          if ! grep -q "Version 2.0" _upstream/LICENSE.txt; then
            echo "::error::Upstream LICENSE.txt no longer references Version 2.0. Manual review required."
            exit 1
          fi
          if ! diff -q _upstream/LICENSE.txt skills/android/skills/google/LICENSE > /dev/null; then
            echo "::notice::Upstream LICENSE differs from vendored copy. Will update in the sync PR."
          fi

      - name: Refresh vendored LICENSE, README, and NOTICE
        run: |
          set -euo pipefail
          cp _upstream/LICENSE.txt skills/android/skills/google/LICENSE
          cp _upstream/README.md skills/android/skills/google/README.md
          if [ -f _upstream/NOTICE ]; then
            cp _upstream/NOTICE skills/android/skills/google/NOTICE
          else
            rm -f skills/android/skills/google/NOTICE
          fi

      - name: Sync SKILL.md directories
        env:
          VENDOR_ROOT: skills/android/skills/google
        run: |
          set -euo pipefail

          mapfile -t upstream_paths < <(find _upstream -name SKILL.md -type f | sort)
          declare -A upstream_names

          for path in "${upstream_paths[@]}"; do
            skill_dir=$(dirname "$path")
            name=$(basename "$skill_dir")
            upstream_names[$name]=1

            target_dir="$VENDOR_ROOT/$name"
            rm -rf "$target_dir"
            mkdir -p "$target_dir"
            cp -r "$skill_dir"/* "$target_dir/"
            echo "Synced: $name"
          done

          for vendored_dir in "$VENDOR_ROOT"/*/; do
            [ -d "$vendored_dir" ] || continue
            name=$(basename "$vendored_dir")
            if [ -z "${upstream_names[$name]:-}" ]; then
              echo "Removing (no longer upstream): $name"
              rm -rf "$vendored_dir"
            fi
          done

      - name: Clean up _upstream clone
        run: rm -rf _upstream

      - name: Detect changes
        id: changes
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected:"
            git status --short
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sincronizar android/skills vendoreados

Auto-sincronización desde android/skills upstream.
Archivos actualizados: SKILL.md, LICENSE, README.
Ver git diff para skills agregadas, modificadas o removidas."
          git push origin main
